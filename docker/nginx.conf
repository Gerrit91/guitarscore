# GuitarScore's browser build as a static site (see the Dockerfile).
#
# Nothing here is content-hashed except the SoundFont (its name carries its version), so
# everything else is revalidated on every load (cheap: nginx answers 304 from the ETag),
# and a new image is picked up at once. The service worker caches the app for offline
# use on top of this.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm
               application/manifest+json text/plain text/css image/svg+xml;
    gzip_vary on;

    # `add_header` is only set here: a location that adds its own would drop these.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    location / {
        try_files $uri $uri/ =404;
        # Cache-Control: no-cache (revalidate each time).
        expires -1;
    }

    # The web app manifest has its own media type.
    location = /manifest.json {
        types { application/manifest+json json; }
        expires -1;
    }

    # The SoundFont's file name changes with its version: cache it for a year. Range
    # requests are answered by nginx as they come.
    location ~* \.sf2$ {
        types { application/octet-stream sf2; }
        expires 1y;
    }
}

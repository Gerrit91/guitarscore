[workspace]
resolver = "2"
members = [
    "crates/gscore-version",
    "crates/gscore-gp",
    "crates/gscore-model",
    "crates/gscore-io",
    "crates/gscore-layout",
    "crates/gscore-play",
    "crates/gscore-guitar",
    "crates/gscore-edit",
    "crates/gscore-audio",
    "crates/gscore-worklet",
    "crates/gscore-session",
    "crates/gscore-cli",
    "crates/gscore-app",
    "xtask",
]
# GuitarScore's fork of RustySynth (see vendor/rustysynth/FORK.md): not a workspace
# member, so the workspace's lints do not apply to foreign code.
exclude = ["vendor/rustysynth"]

[workspace.package]
version = "0.1.1"
authors = ["GuitarScore Team"]
edition = "2024"
license = "MIT"
repository = "https://github.com/Gerrit91/guitarscore"

# Panics must unwind (never abort) so `catch_unwind` containment and the crash-report hook
# work. This is the default; it is spelled out so nobody switches it off for speed.
[profile.dev]
panic = "unwind"

# The audio code is optimized in debug builds too: unoptimized, the modelled strings and
# convolution take several times the time an audio buffer plays for, and playback
# stutters (2026-11-06). The rest of a debug build stays quick to compile.
[profile.dev.package.gscore-guitar]
opt-level = 3

[profile.dev.package.gscore-audio]
opt-level = 3

[profile.dev.package.rustysynth]
opt-level = 3

[profile.release]
panic = "unwind"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"
unused_variables = "warn"
unused_must_use = "warn"
unused_qualifications = "warn"
nonstandard_style = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unused_crate_dependencies = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
# `arithmetic_side_effects` is enabled per crate (parsing, layout, sequencing)
# with `#![warn(clippy::arithmetic_side_effects)]` in lib.rs.

# GuitarScore's fork of RustySynth: each MIDI channel rendered apart, for the mixer
# (vendor/rustysynth/FORK.md).
[patch.crates-io]
rustysynth = { path = "vendor/rustysynth" }

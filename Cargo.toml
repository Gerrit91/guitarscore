[workspace]
resolver = "2"
members = [
    "crates/gscore-model",
    "crates/gscore-io",
    "crates/gscore-layout",
    "crates/gscore-play",
    "crates/gscore-edit",
    "crates/gscore-audio",
    "crates/gscore-session",
    "crates/gscore-cli",
    "crates/gscore-app",
    "xtask",
]

[workspace.package]
version = "0.1.0"
authors = ["GuitarScore Team"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Gerrit91/guitarscore"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"
unused_variables = "warn"
unused_must_use = "warn"
unused_qualifications = "warn"
nonstandard_style = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unused_crate_dependencies = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
# `arithmetic_side_effects` is enabled per crate (parsing, layout, sequencing)
# with `#![warn(clippy::arithmetic_side_effects)]` in lib.rs.

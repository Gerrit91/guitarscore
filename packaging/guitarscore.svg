<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- App icon: a G bent from the band of a steel fingerpick. The blade is the crossbar, the
       three dots are the holes punched into the band. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3345"/><stop offset="1" stop-color="#141821"/>
    </linearGradient>
    <linearGradient id="steel" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#FAFBFD"/><stop offset="0.55" stop-color="#C5CEDB"/><stop offset="1" stop-color="#8794A8"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD27A"/><stop offset="1" stop-color="#F08A1C"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bg)"/>
  <path d="M174.7 81.3 A66 66 0 1 0 194 128" fill="none" stroke="url(#steel)" stroke-width="30" stroke-linecap="round"/>
  <g fill="#1C212C">
    <circle cx="62" cy="128" r="5.5"/>
    <circle cx="67" cy="102.7" r="5.5"/>
    <circle cx="67" cy="153.3" r="5.5"/>
  </g>
  <path d="M209 120 Q209 113 202 113 L168 113 C146 113 124 119 114 128 C124 137 146 143 168 143 L209 143 Z" fill="url(#brass)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- GuitarScore: a guitar headstock in front of a five-line staff. -->
  <defs>
    <clipPath id="tile"><rect x="12" y="12" width="232" height="232" rx="54"/></clipPath>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="54" fill="#26282C"/>
  <g clip-path="url(#tile)">
    <g stroke="#8A9099" stroke-width="5" stroke-linecap="round">
      <line x1="40" y1="86" x2="216" y2="86"/>
      <line x1="40" y1="104" x2="216" y2="104"/>
      <line x1="40" y1="122" x2="216" y2="122"/>
      <line x1="40" y1="140" x2="216" y2="140"/>
      <line x1="40" y1="158" x2="216" y2="158"/>
    </g>
    <!-- headstock and neck, with a gap of the tile's color around them -->
    <path d="M113 260 L113 166 C 108 138, 100 112, 100 78 C 100 54, 108 42, 119 42 C 123 42, 125 46, 128 46 C 131 46, 133 42, 137 42 C 148 42, 156 54, 156 78 C 156 112, 148 138, 143 166 L143 260 Z"
          fill="#F2F3F5" stroke="#26282C" stroke-width="10" stroke-linejoin="round" paint-order="stroke"/>
    <!-- the nut, as a thin gap where the neck meets the head -->
    <line x1="110" y1="168" x2="146" y2="168" stroke="#26282C" stroke-width="3"/>
    <!-- tuner posts -->
    <g fill="#26282C">
      <circle cx="115" cy="72" r="4.5"/>
      <circle cx="115" cy="96" r="4.5"/>
      <circle cx="115" cy="120" r="4.5"/>
      <circle cx="141" cy="72" r="4.5"/>
      <circle cx="141" cy="96" r="4.5"/>
      <circle cx="141" cy="120" r="4.5"/>
    </g>
  </g>
</svg>

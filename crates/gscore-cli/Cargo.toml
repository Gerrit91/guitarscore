[package]
name = "gscore-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gscore-cli"
path = "src/main.rs"

[dependencies]
gscore-model = { path = "../gscore-model" }
gscore-io = { path = "../gscore-io" }
gscore-session = { path = "../gscore-session" }
clap = { version = "4.6.7", features = ["derive"] }

[lints]
workspace = true

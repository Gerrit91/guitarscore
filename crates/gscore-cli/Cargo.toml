[package]
name = "gscore-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gscore-cli"
path = "src/main.rs"

[dependencies]
gscore-version = { path = "../gscore-version" }
gscore-model = { path = "../gscore-model" }
gscore-io = { path = "../gscore-io" }
gscore-edit = { path = "../gscore-edit" }
gscore-session = { path = "../gscore-session" }
gscore-layout = { path = "../gscore-layout", features = ["extra-music-fonts"] }
gscore-play = { path = "../gscore-play" }
gscore-guitar = { path = "../gscore-guitar" }
gscore-audio = { path = "../gscore-audio" }
gscore-plugin = { path = "../gscore-plugin" }
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
# A SoundFont built in code, for the playback test.
gscore-audio = { path = "../gscore-audio", features = ["test-support"] }

[lints]
workspace = true

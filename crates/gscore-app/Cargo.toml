[package]
name = "gscore-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "guitarscore"
path = "src/main.rs"

[dependencies]
gscore-version = { path = "../gscore-version" }
gscore-model = { path = "../gscore-model" }
gscore-edit = { path = "../gscore-edit" }
gscore-layout = { path = "../gscore-layout" }
gscore-session = { path = "../gscore-session" }
gscore-play = { path = "../gscore-play" }
gscore-audio = { path = "../gscore-audio" }
# GUI: egui with the wgpu renderer (the same renderer the snapshot tests use). Default
# features off; window backends for Linux (Wayland, X11) and accessibility are named.
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit", "wayland", "x11", "default_fonts"] }
egui = "0.37"
serde = { version = "1.0.228", features = ["derive"] }
# Native file dialogs (XDG desktop portal on Linux, no GTK).
rfd = "0.17"

[dev-dependencies]
# A command that panics on demand, for the panic-injection test.
gscore-edit = { path = "../gscore-edit", features = ["test-support"] }
# Small songs built in code, for unit tests of the page.
gscore-model = { path = "../gscore-model", features = ["test-support"] }
# A SoundFont built in code, for the synthesizer test.
gscore-audio = { path = "../gscore-audio", features = ["test-support"] }
# Drives the UI headlessly and renders it offscreen for snapshots (no window).
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
# Saving the snapshot example's image as PNG (the version egui_kittest already uses).
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1.0.149"

[lints]
workspace = true

[package]
name = "gscore-audio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# A SoundFont built in code, for tests of other crates. Not part of the normal API.
test-support = []

[dependencies]
gscore-play = { path = "../gscore-play" }
# The modelled guitar and bass strings (M22), mixed with the SoundFont.
gscore-guitar = { path = "../gscore-guitar" }
# SoundFont synthesizer in pure Rust, for playback without an external synth. It is pure
# Rust and builds for wasm, where it runs inside the browser's AudioWorklet.
rustysynth = "1.3.8"
# Ogg Vorbis decoding for SF3 SoundFonts (compressed samples; the browser build ships its
# font so). Pure Rust, builds for wasm.
lewton = "0.10.2"

# Device backends are native only: a browser gets sound from the AudioWorklet instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# MIDI output to any port (ALSA sequencer on Linux, CoreMIDI, WinMM).
midir = "0.11"
# Audio output to the default device (ALSA on Linux, which PipeWire and PulseAudio serve).
cpal = "0.18.2"
# Plugin hosting (M24): CLAP plugins as blocks of a sound chain.
gscore-plugin = { path = "../gscore-plugin" }

# Linux: cpal's PulseAudio host (a pure-Rust client of the PulseAudio protocol, which
# PipeWire serves too) lists the real outputs for Settings › Audio I/O; ALSA alone lists
# every plugin and each card several times. Playback through "System default" stays on
# ALSA (`output_device.rs`). Owner approval 2026-11-26.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }

# The browser output: an AudioWorklet node in the Web Audio graph.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioWorklet",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "BaseAudioContext",
    "Headers",
    "MessageEvent",
    "MessagePort",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Response",
    "Window",
] }

[dev-dependencies]
gscore-audio = { path = ".", features = ["test-support"] }
gscore-model = { path = "../gscore-model", features = ["test-support"] }

[lints]
workspace = true

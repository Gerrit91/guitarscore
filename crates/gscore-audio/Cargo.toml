[package]
name = "gscore-audio"
version = "0.1.0"
edition = "2024"

[features]
# A SoundFont built in code, for tests of other crates. Not part of the normal API.
test-support = []

[dependencies]
gscore-play = { path = "../gscore-play" }
# SoundFont synthesizer in pure Rust, for playback without an external synth. It is pure
# Rust and builds for wasm, where it runs inside the browser's AudioWorklet.
rustysynth = "1.3.8"

# Device backends are native only: a browser gets sound from the AudioWorklet instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# MIDI output to any port (ALSA sequencer on Linux, CoreMIDI, WinMM).
midir = "0.11"
# Audio output to the default device (ALSA on Linux, which PipeWire and PulseAudio serve).
cpal = "0.18.2"

# The browser output: an AudioWorklet node in the Web Audio graph.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioWorklet",
    "AudioWorkletNode",
    "BaseAudioContext",
    "MessageEvent",
    "MessagePort",
    "Response",
    "Window",
] }

[dev-dependencies]
gscore-audio = { path = ".", features = ["test-support"] }
gscore-model = { path = "../gscore-model", features = ["test-support"] }

[lints]
workspace = true

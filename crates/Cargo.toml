[workspace]
members = [
    "gscore-model",
    "gscore-io",
    "gscore-layout",
    "gscore-play",
    "gscore-edit",
    "gscore-audio",
    "gscore-session",
    "gscore-cli",
    "gscore-app",
]

resolver = "2"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = { level = "warn", priority = -1 }

[workspace.lints.rust]
keyword_underscore_member_access = "deny"
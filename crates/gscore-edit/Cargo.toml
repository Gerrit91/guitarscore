[package]
name = "gscore-edit"
version.workspace = true
edition = "2024"

[features]
# Test hooks for other crates (a command that panics on demand). Not part of the normal API.
test-support = []

[dependencies]
gscore-model = { path = "../gscore-model" }

[dev-dependencies]
# Songs built without a fixture file for the command tests.
gscore-model = { path = "../gscore-model", features = ["test-support"] }
# Saving edited songs again proves that every edit stays writable (no `unwrap`s here).
gscore-io = { path = "../gscore-io" }

[lints]
workspace = true

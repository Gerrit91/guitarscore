# Vendored copy of the `guitarpro` crate (MIT, see LICENSE). Changes: see VENDORED.md.
[package]
name = "guitarpro"
version = "0.4.4"
authors = ["slundi"]
edition = "2024"
description = "Rust library for guitar tab files (vendored into GuitarScore)."
repository = "https://github.com/slundi/guitarpro"
license = "MIT"
publish = false

[lib]
name = "guitarpro"
path = "src/lib.rs"

[dependencies]
fraction = "0.17.0"
encoding_rs = "0.8.42"
thiserror = "2.0.18"
zip = "9.0.5"
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1.0.228", features = ["derive"] }

# Vendored code is not yet held to the workspace rules (no-panic lints etc.); it is only
# called from behind `catch_unwind` in gscore-io. Tightening this is tracked in docs/gaps.md.
[lints.rust]
warnings = { level = "allow", priority = -1 }

[lints.clippy]
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }

name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # cpal and midir link against the system ALSA library on Linux (alsa-sys);
    # without the development files the build fails with "system library `alsa`
    # was not found". See README, "On Linux, building needs the ALSA development files".
    #
    # The runner has no GPU, and the snapshot test in gscore-app renders through wgpu
    # (egui_kittest), which then aborts with "No adapter found". Mesa's lavapipe
    # (`mesa-vulkan-drivers`) is a CPU Vulkan adapter that egui_kittest prefers.
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libasound2-dev pkg-config libvulkan1 mesa-vulkan-drivers

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.99.1"  # keep in sync with rust-toolchain.toml
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown
      
    - name: Setup cargo cache
      uses: swatinem/rust-cache@v2
      
    - name: Run cargo fmt
      run: cargo fmt --all -- --check
      
    - name: Run clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
      
    - name: Run tests
      run: cargo test --workspace
      
    - name: Run layer check
      run: cargo xtask layers
